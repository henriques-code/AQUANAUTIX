# AQUANAUTIX — Supabase CLI
# Uso: supabase link --project-ref ycmvqokcfzxkpinvcyhk && supabase db push

project_id = "ycmvqokcfzxkpinvcyhk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[functions.revenuecat-webhook]
verify_jwt = false

[functions.sync-subscription-tier]
verify_jwt = true

[functions.oracle-tides]
verify_jwt = false

[functions.oracle]
# Protótipo órfão de assistente IA (P1 backlog) sem chamador no cliente hoje.
# verify_jwt=true corta o abuso público de créditos OpenAI — ver
# supabase/functions/oracle/index.ts para detalhe.
verify_jwt = true

[functions.vision-scan]
verify_jwt = false
